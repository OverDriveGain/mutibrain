name: AIAssistant
options:
  bundleIdPrefix: com.manarz
  deploymentTarget:
    # 17.0: the vendored MyMuChat client (claudecodeui/ios-native) targets iOS 17.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Set your Apple Developer team ID here (or in Xcode after generating).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  AIAssistant:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Vendored native MyMu chat client (from claudecodeui/ios-native) — the
      # Chat tab. Excludes its standalone-app entry point.
      - path: MyMuChat
        excludes:
          - "**/MyMuApp.swift"
    dependencies:
      - target: ScreenBroadcast
        embed: true
      - target: OpenerControl
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manarz.myagent
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AIAssistant.entitlements
        # iPhone-only (xcodegen defaults targets to "1,2"; must override here or
        # the project-level value is ignored and iPad multitasking rules apply).
        TARGETED_DEVICE_FAMILY: "1"
        # App icon lives in App/Assets.xcassets/AppIcon.appiconset (single 1024).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ExcCatch: ObjC NSException-catch shim for AVAudioEngine graph calls
        SWIFT_OBJC_BRIDGING_HEADER: App/BridgingHeader.h

  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - ScreenBroadcast
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manarz.myagent.ScreenBroadcast
        INFOPLIST_FILE: ScreenBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenBroadcast/ScreenBroadcast.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  # iOS 18 Control Center button → "ProAgent — Opener". Tapping it runs
  # WriteOpenerIntent in the background (no app switch): reads the live screen
  # broadcast frame, writes an opener, copies it to the clipboard. Targets iOS
  # 18 (Controls API) even though the app is 17 — it simply won't appear on
  # older devices. Shares the App Group so it can read the server URL + token.
  OpenerControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - OpenerControl
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manarz.myagent.OpenerControl
        INFOPLIST_FILE: OpenerControl/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenerControl/OpenerControl.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        # Controls (ControlWidget) are iOS 18 API — pin this target to 18 even
        # though the app is 17, so the iOS 18 symbols compile without guards.
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
