name: AIAssistant
options:
  bundleIdPrefix: com.manarz
  deploymentTarget:
    # 17.0: the vendored MyMuChat client (claudecodeui/ios-native) targets iOS 17.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Set your Apple Developer team ID here (or in Xcode after generating).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  AIAssistant:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Vendored native MyMu chat client (from claudecodeui/ios-native) — the
      # Chat tab. Excludes its standalone-app entry point.
      - path: MyMuChat
        excludes:
          - "**/MyMuApp.swift"
    dependencies:
      - target: ScreenBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manarz.myagent
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AIAssistant.entitlements
        # iPhone-only (xcodegen defaults targets to "1,2"; must override here or
        # the project-level value is ignored and iPad multitasking rules apply).
        TARGETED_DEVICE_FAMILY: "1"
        # App icon lives in App/Assets.xcassets/AppIcon.appiconset (single 1024).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ExcCatch: ObjC NSException-catch shim for AVAudioEngine graph calls
        SWIFT_OBJC_BRIDGING_HEADER: App/BridgingHeader.h

  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - ScreenBroadcast
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manarz.myagent.ScreenBroadcast
        INFOPLIST_FILE: ScreenBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenBroadcast/ScreenBroadcast.entitlements
        TARGETED_DEVICE_FAMILY: "1"
